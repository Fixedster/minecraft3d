<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test</title></head>
<body style="background:#000;color:#0f0;font-size:20px;padding:20px">
<div id="out">Loading Three.js...</div>
<script src="three.min.js"></script>
<script>
var out = document.getElementById('out');
try {
  if (typeof THREE === 'undefined') throw new Error('THREE not defined');
  out.innerHTML += '<br>THREE loaded: v' + THREE.REVISION;
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(75, 1, 0.1, 100);
  var renderer = new THREE.WebGLRenderer();
  renderer.setSize(200, 200);
  document.body.appendChild(renderer.domElement);
  out.innerHTML += '<br>Renderer created OK';
  var geo = new THREE.BoxGeometry(1,1,1);
  var mat = new THREE.MeshLambertMaterial({color: 0x00ff00});
  var cube = new THREE.Mesh(geo, mat);
  scene.add(cube);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  camera.position.z = 3;
  renderer.render(scene, camera);
  out.innerHTML += '<br>Render OK!';
  out.style.color = '#0f0';
} catch(e) {
  out.innerHTML += '<br>Error: ' + e.message;
  out.style.color = '#f00';
}
</script>
</body></html>
