<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test</title></head>
<body style="margin:0;overflow:hidden;background:#000">
<div id="msg" style="color:#fff;font-size:20px;padding:20px;position:fixed;z-index:100">Loading...</div>
<script src="three.min.js"></script>
<script>
window.onload = function() {
  var msg = document.getElementById('msg');
  try {
    msg.textContent = 'THREE version: ' + THREE.REVISION;

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    var camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    var renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Add light
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 30);
    scene.add(dirLight);

    // Add ground
    var groundGeo = new THREE.BoxGeometry(20, 1, 20);
    var groundMat = new THREE.MeshLambertMaterial({color: 0x3a7a3a});
    var ground = new THREE.Mesh(groundGeo, groundMat);
    scene.add(ground);

    // Add some cubes
    for (var x = -3; x <= 3; x++) {
      for (var z = -3; z <= 3; z++) {
        var geo = new THREE.BoxGeometry(1, 1, 1);
        var mat = new THREE.MeshLambertMaterial({color: 0x8B4513});
        var cube = new THREE.Mesh(geo, mat);
        cube.position.set(x, 1, z);
        scene.add(cube);
      }
    }

    msg.textContent = 'OK! Click to start.';

    renderer.render(scene, camera);
  } catch(e) {
    msg.innerHTML = '<span style="color:red">Error: ' + e.message + '<br>' + (e.stack||'') + '</span>';
  }
};
</script>
</body></html>
